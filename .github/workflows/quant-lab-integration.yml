name: Master Quant Lab integration checks

on:
  push:
    branches:
      - "feature/quant-lab-master-integration-20261123"
  pull_request:

permissions:
  contents: read

jobs:
  quant-lab-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas pytest streamlit
      - name: Compile master app and research modules
        run: python -m compileall -q app.py quant_research
      - name: Run deterministic quant tests
        run: python -m pytest tests/test_quant_research.py -q
      - name: Check master navigation entry
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("app.py").read_text(encoding="utf-8")
          assert s.count('"key": "quant_lab"') == 1
          assert s.count('elif current_page == "quant_lab":') == 1
          from quant_research.ui import render_quant_lab
          assert callable(render_quant_lab)
          print("Integrated navigation and render function available")
          PY
