name: Quant Research MVP checks

on:
  push:
    branches:
      - "feature/personal-ai-os-quant-mvp-20261123"
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic test dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Compile research modules
        run: python -m compileall -q quant_research research_app.py modules/hot_timeline.py
      - name: Run offline checks (no live API calls)
        run: python -m pytest -q tests/test_quant_research.py tests/test_hot_timeline.py
